name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      oidc_check:
        description: >-
          Only probe the npm Trusted Publishing exchange and print what it says; do not
          release. Use this to match the npmjs.com Trusted Publisher form to the token's
          claims without a release attempt.
        type: boolean
        default: false

# NOT keyed on the ref. A ref-keyed group lets two refs release at the same time, which is
# exactly what happened while `main` and `master` both existed and both triggered this
# workflow: two semantic-release runs raced to publish the same version. One group per
# repository means releases always serialise, whatever triggers them.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release commits the changelog and pushes the tag
      issues: write # release notes are posted to related issues
      pull-requests: write
      id-token: write # the OIDC token for npm Trusted Publishing, and npm provenance
    steps:
      # v4 of both actions runs on Node 20, which GitHub has deprecated on its runners; v7
      # targets Node 24 natively.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release reads the full tag history
          persist-credentials: false

      # Deliberately NO `registry-url`. With it, setup-node writes an .npmrc whose auth line
      # is `_authToken=${NODE_AUTH_TOKEN}`, and npm 11 substitutes an UNSET variable with the
      # literal text `${NODE_AUTH_TOKEN}`, which it then sends to the registry as a bearer
      # token on every request, `npm ci` included. @semantic-release/npm never needed that
      # file: it writes its own .npmrc from the exchanged OIDC token and passes it to every
      # npm command it runs. See RELEASING.md.
      - uses: actions/setup-node@v7
        with:
          # semantic-release 25 requires ^22.22.2 || >=24.15.
          node-version: '24'
          cache: npm

      # npm Trusted Publishing (OIDC) needs npm >= 11.5.1. The runner's bundled npm tracks the
      # Node release and is not guaranteed to be new enough, so it is raised explicitly rather
      # than left to chance - an old npm makes the OIDC exchange fail in a way that looks like
      # a bad token.
      - name: Ensure npm supports Trusted Publishing
        run: |
          npm install -g npm@^11
          echo "npm $(npm --version)"

      - run: npm ci

      # The gate. A release must never ship code that has not passed the same checks a PR does.
      - run: npm run lint
      - run: npm run build
      - run: npm run test

      # The second gate: no OIDC, no release.
      #
      # Trusted Publishing is the only way this package can be published unattended: npm
      # requires a one-time password for the token kind NPM_TOKEN held, which is why the 1.2.0
      # and 1.3.0 runs failed at `npm publish`. And a publish failure is not harmless, because
      # semantic-release commits the version bump and pushes the tag BEFORE it publishes, so a
      # failed publish leaves a tagged, unpublished release that blocks the next attempt.
      #
      # So the same OIDC token @semantic-release/npm would use is minted here and exchanged
      # with the registry first. The claims it carries are printed because they are exactly
      # what the npmjs.com Trusted Publisher form has to match; a 404 "package not found" from
      # the exchange means no entry matches them. If the exchange fails this job fails here,
      # with nothing committed and nothing tagged. Neither token is ever printed.
      #
      # With oidc_check=true (workflow_dispatch) the step reports and the job ends; nothing
      # is released either way.
      - name: Verify the npm Trusted Publishing exchange
        id: oidc
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token endpoint in this job. Is 'id-token: write' still set on the release job?"
            exit 1
          fi
          id_token="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | node -e 'process.stdin.on("data",d=>process.stdout.write(JSON.parse(d).value))')"
          echo "Token claims npm matches against the Trusted Publisher form:"
          printf '%s' "${id_token}" | node -e '
            const t = require("fs").readFileSync(0, "utf8").trim();
            const c = JSON.parse(Buffer.from(t.split(".")[1], "base64url").toString("utf8"));
            for (const k of ["repository", "repository_owner", "workflow_ref", "job_workflow_ref", "environment", "ref", "event_name"]) console.log(`  ${k}: ${c[k] ?? "(absent)"}`);'
          code="$(curl -sS -o /tmp/exchange.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${id_token}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/sf-testimpact")"
          echo "npm exchange: HTTP ${code}"
          node -e 'const r = JSON.parse(require("fs").readFileSync("/tmp/exchange.json","utf8")); delete r.token; console.log("  " + JSON.stringify(r));' 2>/dev/null || cat /tmp/exchange.json
          # Any 2xx is success. The registry answers 201 Created with the exchanged token; the
          # first version of this check accepted only 200 and so rejected a working setup.
          case "${code}" in
            2??)
              echo "Trusted Publishing works."
              exit 0
              ;;
          esac
          msg="npm did not accept this workflow as a trusted publisher (HTTP ${code}). The package's Trusted Publisher must be GitHub Actions, repository 'muraliseelam/sf-testimpact', workflow file 'release.yml', no environment, AND it must grant the publish permission: an entry that grants only 'stage publish' is answered with this same 404. Check with: npm trust list sf-testimpact. Linking GitHub to the npm account is not the same thing."
          if [ "${{ inputs.oidc_check }}" = "true" ]; then
            echo "::warning::${msg}"
            exit 0
          fi
          echo "::error::${msg} Stopping before semantic-release so no version bump or tag is left behind."
          exit 1

      - run: npx semantic-release
        if: ${{ inputs.oidc_check != true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          GIT_AUTHOR_NAME: Murali Seelam
          GIT_AUTHOR_EMAIL: muraliseelam1@gmail.com
          GIT_COMMITTER_NAME: Murali Seelam
          GIT_COMMITTER_EMAIL: muraliseelam1@gmail.com
