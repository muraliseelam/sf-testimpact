name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# NOT keyed on the ref. A ref-keyed group lets two refs release at the same time, which is
# exactly what happened while `main` and `master` both existed and both triggered this
# workflow: two semantic-release runs raced to publish the same version. One group per
# repository means releases always serialise, whatever triggers them.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release commits the changelog and pushes the tag
      issues: write # release notes are posted to related issues
      pull-requests: write
      id-token: write # the OIDC token for npm Trusted Publishing, and npm provenance
    steps:
      # v4 of both actions runs on Node 20, which GitHub has deprecated on its runners; v7
      # targets Node 24 natively.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release reads the full tag history
          persist-credentials: false

      # Deliberately NO `registry-url`. With it, setup-node writes an .npmrc whose auth line
      # is `_authToken=${NODE_AUTH_TOKEN}`, and npm 11 substitutes an UNSET variable with the
      # literal text `${NODE_AUTH_TOKEN}`, which it then sends to the registry as a bearer
      # token on every request, `npm ci` included. setup-node v4 masked that by exporting a
      # dummy value; v7 stopped. @semantic-release/npm never needed that file: it writes its
      # own .npmrc from NPM_TOKEN or the exchanged OIDC token and passes it to every npm
      # command it runs. See RELEASING.md.
      - uses: actions/setup-node@v7
        with:
          # semantic-release 25 requires ^22.22.2 || >=24.15.
          node-version: '24'
          cache: npm

      # npm Trusted Publishing (OIDC) needs npm >= 11.5.1. The runner's bundled npm tracks the
      # Node release and is not guaranteed to be new enough, so it is raised explicitly rather
      # than left to chance - an old npm makes the OIDC exchange fail in a way that looks like
      # a bad token.
      - name: Ensure npm supports Trusted Publishing
        run: |
          npm install -g npm@^11
          echo "npm $(npm --version)"

      - run: npm ci

      # The gate. A release must never ship code that has not passed the same checks a PR does.
      - run: npm run lint
      - run: npm run build
      - run: npm run test

      # Preflight: say which authentication path this run can use, BEFORE semantic-release
      # starts, because its own error for a bad token ("EINVALIDNPMTOKEN Invalid npm token")
      # names neither the cause nor the fix.
      #
      # Two paths exist and @semantic-release/npm tries them in this order:
      #   1. Trusted Publishing (OIDC). Needs `id-token: write` above and a Trusted Publisher
      #      configured for this package on npmjs.com (RELEASING.md has the three fields).
      #      Nothing here can check the npm-side setting; semantic-release's log line
      #      "OIDC token exchange with the npm registry failed: 404" is what it looks like
      #      when it is missing.
      #   2. NPM_TOKEN. Since the 1.2.0 run this fails at publish with EOTP: npm requires a
      #      one-time password for this kind of token, which an unattended run cannot supply.
      #      It is kept only until the first OIDC release has succeeded, then deleted.
      #
      # A token that `npm whoami` rejects is therefore a WARNING, not a failure: failing here
      # would let a stale secret block a release that OIDC would have completed.
      - name: Preflight npm authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token endpoint in this job. Is 'id-token: write' still set on the release job?"
            exit 1
          fi
          echo "OIDC: token endpoint present; Trusted Publishing will be attempted first."

          if [ -z "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN: not set. This run relies on Trusted Publishing alone."
            exit 0
          fi

          trimmed="$(printf '%s' "${NPM_TOKEN}" | tr -d '[:space:]')"
          if [ "${#trimmed}" -ne "${#NPM_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN contains whitespace (probably a trailing newline from \`gh secret set\`). It cannot work as a fallback. Re-set it with: printf '%s' \"\$TOKEN\" | gh secret set NPM_TOKEN"
            exit 0
          fi
          echo "NPM_TOKEN: present, ${#NPM_TOKEN} chars, prefix '$(printf '%s' "${NPM_TOKEN}" | cut -c1-4)'."

          npmrc="${RUNNER_TEMP}/preflight.npmrc"
          printf '//registry.npmjs.org/:_authToken=${NPM_TOKEN}\n' > "${npmrc}"
          if npm whoami --userconfig "${npmrc}" --registry https://registry.npmjs.org/ >/tmp/whoami 2>/tmp/whoami.err; then
            echo "NPM_TOKEN: npm whoami says $(cat /tmp/whoami). Note that whoami succeeding does not mean publish will: since 1.2.0 this token type fails at publish with EOTP (one-time password required). Trusted Publishing is the path that works."
          else
            echo "::warning::NPM_TOKEN is present but 'npm whoami' rejects it, so the token fallback is dead. The release succeeds only if Trusted Publishing is configured on npmjs.com (package Settings -> Trusted Publisher -> GitHub Actions, repo muraliseelam/sf-testimpact, workflow release.yml)."
            sed 's/^/  /' /tmp/whoami.err || true
          fi

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          GIT_AUTHOR_NAME: Murali Seelam
          GIT_AUTHOR_EMAIL: muraliseelam1@gmail.com
          GIT_COMMITTER_NAME: Murali Seelam
          GIT_COMMITTER_EMAIL: muraliseelam1@gmail.com
