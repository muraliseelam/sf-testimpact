name: CI

on:
  push:
    # `main` is the only branch. The repository briefly had an identical `master` alongside it
    # (see RELEASING.md); it has been deleted, so `master` is no longer listed here.
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24']
    steps:
      # v4 of both actions runs on Node 20, which GitHub has deprecated on its runners and
      # forces onto Node 24 with a warning on every run. v7 of each targets Node 24 natively.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
