name: CI

on:
  push:
    # `main` is the only branch. The repository briefly had an identical `master` alongside it
    # (see RELEASING.md); it has been deleted, so `master` is no longer listed here.
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24']
    steps:
      # v4 of both actions runs on Node 20, which GitHub has deprecated on its runners and
      # forces onto Node 24 with a warning on every run. v7 of each targets Node 24 natively.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage

      # docs/commands.md carries a flag reference generated from the command definitions.
      # Regenerate it and fail on any difference, so the documented flags cannot drift from
      # the real ones. Run `npm run docs:commands` and commit the result to fix it.
      - name: Check the generated command reference is current
        if: matrix.node == '24'
        run: |
          npx oclif readme --readme-path docs/commands.md --no-source-links
          git diff --exit-code -- docs/commands.md
